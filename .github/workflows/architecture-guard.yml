name: Architecture Guard CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  architecture-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: 1. Run ESLint Architecture Guard
      run: npx eslint src/ --config eslint.config.js
      
    - name: 2. Run Semantic Prebuild Scanner
      run: npm run prebuild

    - name: 3. Verify Build Integrity
      run: npm run build
